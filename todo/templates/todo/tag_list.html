{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Tags</h1>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add Tag</a>
</div>

<div class="card shadow-sm">
    <table class="table table-hover mb-0">
        <thead class="table-light">
            <tr>
                <th>Name</th>
                <th class="text-end">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for tag in tags %}
            <tr>
                <td class="align-middle fw-bold">{{ tag.name }}</td>
                <td class="text-end">
                    <a href="{% url 'todo:tag-update' tag.id %}" class="btn btn-outline-primary btn-sm me-1">Update</a>
                    <a href="{% url 'todo:tag-delete' tag.id %}" class="btn btn-outline-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center py-4">No tags yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
