{% extends "base.html" %}
{% block content %}
  <h1>{% if object %}Update{% else %}Create{% endif %} Task</h1>
  <form action="" method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save Task</button>
    <a href="{% url 'todo:index' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
