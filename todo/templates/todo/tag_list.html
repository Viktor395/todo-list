{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Tags</h1>
    <a href="#" class="btn btn-primary">Add Tag</a>
</div>

<table class="table table-hover mt-3">
    <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for tag in tags %}
        <tr>
            <td class="align-middle">{{ tag.name }}</td>
            <td>
                <a href="#" class="btn btn-outline-primary btn-sm me-1">Update</a>
                <a href="#" class="btn btn-outline-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center">No tags yet.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
